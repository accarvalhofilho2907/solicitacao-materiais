{% extends "base.html" %}
{% block title %}Inspecionar{% endblock %}
{% block content %}
<h4 class="mb-3">Inspeções — checklist</h4>
<div class="alert alert-secondary small py-2">Escolha o material que vai inspecionar e o modelo de checklist a usar.</div>

<form method="get" class="card"><div class="card-body">
  <div class="row g-2">
    <div class="col-md-6"><label class="form-label small">Material</label>
      <select name="produto_id" class="form-select" required>
        <option value="">— escolha —</option>
        {% for m in materiais %}<option value="{{ m.id }}">{{ m.nome }}</option>{% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label small">Modelo de checklist</label>
      <select name="modelo_id" class="form-select" required>
        <option value="">— escolha —</option>
        {% for md in modelos_disp %}<option value="{{ md.id }}">{{ md.nome }}</option>{% endfor %}
      </select></div>
  </div>
  <button class="btn btn-primary mt-3">Continuar</button>
</div></form>
{% endblock %}
